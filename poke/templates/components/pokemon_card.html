<div class="bg-white dark:bg-gray-700 rounded-xl shadow p-4 text-center hover:shadow-lg transition transform hover:-translate-y-1 dark:shadow-gray-800/50">
  <img src="{{ pokemon.sprite_url }}" alt="{{ pokemon.name }}"
       class="mx-auto w-24 h-24 object-contain mb-2"
       onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/0.png'">

  <h3 class="text-xl font-semibold capitalize text-gray-800 dark:text-white">{{ pokemon.name }}</h3>
  <p class="text-gray-500 dark:text-gray-300">#{{ pokemon.pokemon_id|stringformat:"03d" }}</p>

  <div class="flex justify-center gap-1 my-2">
    {% for type in pokemon.types %}
      <span class="px-2 py-0.5 rounded-full bg-{{ type }}-100 text-{{ type }}-800 text-xs dark:bg-opacity-30">
        {{ type|slice:":3" }}
      </span>
    {% endfor %}
  </div>

  <a href="{% url 'pokemon-detail-html' pokemon.pokemon_id %}"
     class="mt-2 inline-block">
    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png"
         alt="Ver detalle"
         class="w-8 h-8 mx-auto hover:animate-bounce">
  </a>
</div>
