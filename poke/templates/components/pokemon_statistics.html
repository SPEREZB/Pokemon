 <div class="mb-8">
          <h2 class="text-2xl font-bold mb-4 text-gray-800 dark:text-white border-b pb-2 dark:border-gray-600">Estadísticas Base</h2>
          <div class="space-y-4">
            {% for stat, value in pokemon.stats.items %}
            {% widthratio value 255 100 as width_percentage %}
            <div class="mb-4">
              <div class="flex justify-between items-center mb-1">
                <span class="text-sm font-medium capitalize text-gray-700 dark:text-gray-200">{{ stat }}</span>
                <span class="text-xs font-semibold bg-gray-100 dark:bg-gray-700 px-2 py-1 rounded-full dark:text-gray-200">{{ value }}</span>
              </div>
              <div class="w-full bg-gray-100 dark:bg-gray-700 rounded-full h-3 overflow-hidden">
                <div class="h-full bg-gradient-to-r from-green-400 to-green-600 rounded-full transition-all duration-500"
                     style="width: {{ width_percentage }}%"></div>
              </div>
            </div>
            {% endfor %}
          </div>
        </div>
