<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Pokémon App{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <link rel="icon" href="https://raw.githubusercontent.com/PokeAPI/media/master/logo/pokeapi_256.png">
</head>
<body class="bg-gradient-to-b from-blue-50 to-white dark:bg-gradient-to-b dark:from-gray-900 dark:to-gray-800 min-h-screen font-sans">
  <div class="container mx-auto px-4 py-2">

    {% block content %}{% endblock %}
  </div>
</body>
</html>
